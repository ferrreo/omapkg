# Manifest-aware Omarchy client migration settings.
# Copy to /etc/omarchy/manifest-client.conf and source only from the wrapper.
OMARCHY_MANIFEST_CLIENT=/usr/lib/omarchy/omapkg-manifest-client
OMARCHY_RELEASE_KEY=/etc/omarchy/omapkg-release-key.asc
OMARCHY_RELEASE_FINGERPRINT=
OMARCHY_CHANNEL=stable
# Channel pointer/discovery URL; it may redirect to an immutable transaction.
OMARCHY_MANIFEST_DISCOVERY_URL=
OMARCHY_MANIFEST_ORIGIN=
OMARCHY_PACMAN_CONFIG=/etc/pacman.conf
OMARCHY_MANIFEST_STATE=/var/lib/omarchy/manifest-state.json
OMARCHY_MANIFEST_STAGE=/var/lib/omarchy/manifest-stage
OMARCHY_PACMAN=pacman

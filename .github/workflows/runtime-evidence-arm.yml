name: ARM runtime evidence validation

on:
  workflow_dispatch:
    inputs:
      registry_namespace:
        description: Registry namespace for validated builder and runtime images
        required: true
        type: string
      image_tag:
        description: Immutable rollout tag
        required: true
        type: string
      builder_image:
        description: Existing digest-pinned ARM builder (supply with runtime_image to run regression without rebuilding images)
        required: false
        type: string
      runtime_image:
        description: Existing digest-pinned ARM runtime for regression
        required: false
        type: string
      preserved_recipe:
        description: Capture private frozen inputs and build original asdcontrol offline on ARM
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arm-runtime-evidence-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      REGISTRY_NAMESPACE: ${{ inputs.registry_namespace }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Require private storage for retained bootstrap inputs
        if: ${{ inputs.preserved_recipe && !github.event.repository.private }}
        run: |
          echo 'Preserved recipe acceptance retains private helper and bootstrap inputs. Run this mode in a private repository.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: worker/go.mod
      - name: Build signature-verified ARM images
        if: ${{ !inputs.preserved_recipe && inputs.builder_image == '' && inputs.runtime_image == '' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          [[ "$REGISTRY_NAMESPACE" =~ ^registry\.cloudflare\.com/[a-f0-9]{32}$ ]]
          [[ "$IMAGE_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]
          export OPR_ARM_WORKDIR="$RUNNER_TEMP/arm-images"
          export OPR_ARM_IMAGE="$REGISTRY_NAMESPACE/omarpkg-arch-builder:$IMAGE_TAG"
          scripts/build-arm-image.sh
          docker build -t "$REGISTRY_NAMESPACE/omarpkg-arch-runtime:$IMAGE_TAG" \
            -f worker/images/aarch64/runtime.Dockerfile "$OPR_ARM_WORKDIR/context"
          for image in "$REGISTRY_NAMESPACE/omarpkg-arch-builder:$IMAGE_TAG" "$REGISTRY_NAMESPACE/omarpkg-arch-runtime:$IMAGE_TAG"; do
            docker save -o "$RUNNER_TEMP/image-keyring-check.tar" "$image"
            python3 scripts/check-image-keyrings.py "$RUNNER_TEMP/image-keyring-check.tar"
            rm "$RUNNER_TEMP/image-keyring-check.tar"
          done
      - name: Push images with temporary rollout credential
        if: ${{ !inputs.preserved_recipe && inputs.builder_image == '' && inputs.runtime_image == '' }}
        shell: bash
        env:
          REGISTRY_ROLLOUT_AUTH: ${{ secrets.REGISTRY_ROLLOUT_AUTH }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/registry-auth"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_ROLLOUT_AUTH" > "$DOCKER_CONFIG/config.json"
          chmod 600 "$DOCKER_CONFIG/config.json"
          docker push "$REGISTRY_NAMESPACE/omarpkg-arch-builder:$IMAGE_TAG"
          docker push "$REGISTRY_NAMESPACE/omarpkg-arch-runtime:$IMAGE_TAG"
          builder=$(docker image inspect --format '{{index .RepoDigests 0}}' "$REGISTRY_NAMESPACE/omarpkg-arch-builder:$IMAGE_TAG")
          runtime=$(docker image inspect --format '{{index .RepoDigests 0}}' "$REGISTRY_NAMESPACE/omarpkg-arch-runtime:$IMAGE_TAG")
          printf 'OPR_WORKER_E2E_IMAGE=%s\nOPR_WORKER_E2E_RUNTIME_IMAGE=%s\n' "$builder" "$runtime" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$builder" "$runtime"
      - name: Pull retained images for native regression
        if: ${{ !inputs.preserved_recipe && (inputs.builder_image != '' || inputs.runtime_image != '') }}
        shell: bash
        env:
          BUILDER_IMAGE: ${{ inputs.builder_image }}
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
          REGISTRY_NATIVE_TEST_AUTH: ${{ secrets.REGISTRY_NATIVE_TEST_AUTH }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          for image in "$BUILDER_IMAGE" "$RUNTIME_IMAGE"; do
            [[ "$image" =~ ^registry\.cloudflare\.com/[a-f0-9]{32}/[a-z0-9._-]+@sha256:[a-f0-9]{64}$ ]]
          done
          export DOCKER_CONFIG="$RUNNER_TEMP/native-regression-auth"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_NATIVE_TEST_AUTH" > "$DOCKER_CONFIG/config.json"
          chmod 600 "$DOCKER_CONFIG/config.json"
          unset REGISTRY_NATIVE_TEST_AUTH
          docker pull "$BUILDER_IMAGE"
          docker pull "$RUNTIME_IMAGE"
          test "$(docker image inspect --format '{{.Architecture}}' "$BUILDER_IMAGE")" = arm64
          test "$(docker image inspect --format '{{.Architecture}}' "$RUNTIME_IMAGE")" = arm64
          printf 'OPR_WORKER_E2E_IMAGE=%s\nOPR_WORKER_E2E_RUNTIME_IMAGE=%s\n' "$BUILDER_IMAGE" "$RUNTIME_IMAGE" >> "$GITHUB_ENV"
      - name: Native dependency and isolation regression
        if: ${{ !inputs.preserved_recipe }}
        shell: bash
        env:
          OPR_WORKER_E2E_RUNTIME: docker
          OPR_WORKER_E2E_ARCH: aarch64
        run: |
          set -euo pipefail
          cd worker
          go test -v ./...
      - name: Native preserved recipe with frozen bootstrap inputs
        if: ${{ inputs.preserved_recipe }}
        shell: bash
        env:
          BUILDER_IMAGE: ${{ inputs.builder_image }}
          REGISTRY_NATIVE_TEST_AUTH: ${{ secrets.REGISTRY_NATIVE_TEST_AUTH }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          [[ "$BUILDER_IMAGE" =~ ^registry\.cloudflare\.com/[a-f0-9]{32}/[a-z0-9._-]+@sha256:[a-f0-9]{64}$ ]]
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman
          auth_dir="$RUNNER_TEMP/preserved-registry"
          mkdir -m 700 "$auth_dir"
          auth="$auth_dir/config.json"
          cleanup() {
            rm -f "$auth"
            rmdir "$auth_dir"
            if [[ -d "$RUNNER_TEMP/preserved-asdcontrol" ]]; then
              sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/preserved-asdcontrol"
            fi
          }
          trap cleanup EXIT
          printf '%s' "$REGISTRY_NATIVE_TEST_AUTH" > "$auth"
          chmod 600 "$auth"
          unset REGISTRY_NATIVE_TEST_AUTH
          sudo podman pull --authfile "$auth" "$BUILDER_IMAGE"
          DOCKER_CONFIG="$auth_dir" docker pull "$BUILDER_IMAGE"
          test "$(sudo podman image inspect --format '{{.Architecture}}' "$BUILDER_IMAGE")" = arm64
          sudo env PATH="$PATH" python3 scripts/check-preserved-recipe.py \
            --output "$RUNNER_TEMP/preserved-asdcontrol" --helper-image "$BUILDER_IMAGE" --helper-shell-analysis --preparation-runtime docker
      - name: Archive native source, bootstrap and build evidence
        if: ${{ inputs.preserved_recipe && github.event.repository.private && always() }}
        shell: bash
        run: tar -cf "$RUNNER_TEMP/preserved-asdcontrol.tar" -C "$RUNNER_TEMP" preserved-asdcontrol
      - name: Retain native source, bootstrap and build evidence
        if: ${{ inputs.preserved_recipe && github.event.repository.private && always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preserved-asdcontrol-arm
          path: ${{ runner.temp }}/preserved-asdcontrol.tar
          if-no-files-found: error
          compression-level: 0
